name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  license-check:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses
        run: cargo deny check licenses

  build:
    name: Build ${{ matrix.target }}
    needs: license-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt_pkg: ""
            linker: ""
          - target: aarch64-unknown-linux-gnu
            apt_pkg: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.apt_pkg != ''
        run: sudo apt-get install -y ${{ matrix.apt_pkg }}

      - name: Build
        run: cargo build --release -p obtuiner -p powermenu --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Package binaries
        id: package
        run: |
          MAIN_BIN=obtuiner
          PLUGIN_BIN=obtuiner-powermenu
          ARCHIVE="obtuiner-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          PLUGIN_ARCHIVE="obtuiner-powermenu-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/$MAIN_BIN" "staging/$MAIN_BIN"
          cp "target/${{ matrix.target }}/release/$PLUGIN_BIN" "staging/$PLUGIN_BIN"
          tar -czf "$ARCHIVE" -C staging "$MAIN_BIN"
          tar -czf "$PLUGIN_ARCHIVE" -C staging "$PLUGIN_BIN"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha256sum "$PLUGIN_ARCHIVE" > "$PLUGIN_ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "PLUGIN_ARCHIVE=$PLUGIN_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload binary release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.ARCHIVE }}
            ${{ steps.package.outputs.ARCHIVE }}.sha256
            ${{ steps.package.outputs.PLUGIN_ARCHIVE }}
            ${{ steps.package.outputs.PLUGIN_ARCHIVE }}.sha256

      - name: Upload install script (x86_64 job only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
