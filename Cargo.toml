[workspace]
members = [
    "obtuiner",
    "installer",
    "launcher",
    "updater",
    "tui_kit",
    "core_domain",
    "runtime_ops",
]
resolver = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
